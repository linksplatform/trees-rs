[package]
name = "platform-trees"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["uselesssgoddess", "Linksplatform Team <linksplatformtechnologies@gmail.com>"]
license = "Unlicense"
repository = "https://github.com/linksplatform/trees-rs"
homepage = "https://github.com/linksplatform/trees-rs"
description = """
Trees methods for linksplatform
"""
readme = "README.md"
keywords = ["trees", "linksplatform", "data-structures"]
categories = ["data-structures"]

[lib]
name = "platform_trees"
path = "src/lib.rs"

[dependencies]
num-traits = "0.2.19"
platform-num = "0.6.0"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
